[profile.default]
# Retry once so one transient failure does not fail full-CI outright.
# Fanout keeps the full-CI shards moving without treating every >30s test as
# stuck. Keep this aligned with the broader timeout budget we give sharded CI.
slow-timeout = { period = "30s", terminate-after = 2 }
retries = 1

[[profile.default.overrides]]
# Decompressing and comparing the precomputed schema exports is CPU-bound
# and regularly brushes past the default window on loaded machines.
filter = 'package(codex-app-server-protocol) & test(precomputed_exports_match_generated)'
slow-timeout = { period = "1m", terminate-after = 3 }

[[profile.default.overrides]]
# These cases cold-start a daemon before confirming a second launch with new settings.
filter = 'package(codex-cli) & binary(daemon_startup) & test(requires_confirmation_to_disable_)'
slow-timeout = { period = "1m", terminate-after = 2 }

[[profile.default.overrides]]
# This case validates and copies both the initial and replacement debug package.
filter = 'package(codex-cli) & binary(app_server_daemon) & test(=packaged_daemon_start_and_explicit_replacement)'
slow-timeout = { period = "1m", terminate-after = 3 }

[[profile.default.overrides]]
# These cases copy a full debug CLI package and launch its new executable.
filter = 'package(codex-cli) & binary(app_server_daemon) & test(packaged_daemon_)'
slow-timeout = { period = "1m", terminate-after = 2 }

[profile.default.junit]
path = "junit.xml"

[profile.local]
inherits = "default"

[test-groups.app_server_protocol_codegen]
max-threads = 1

[test-groups.app_server_integration]
max-threads = 1

# Higher concurrency causes integration test timeouts under resource contention
# on common developer machines.
[test-groups.app_server_integration_local]
max-threads = 4

[test-groups.rig_bridge_wire_local]
# Each wire test builds fresh HTTP/TLS clients; concurrent platform setup
# can exceed initialization deadlines on developer machines.
max-threads = 4

[test-groups.http_client_default_pool_local]
# Same mechanism as rig_bridge_wire_local: default client construction reads
# macOS system proxy settings synchronously, so heavy local parallelism can
# overrun the pool tests' short fixture deadlines.
max-threads = 4

[test-groups.core_apply_patch_cli_integration]
max-threads = 1

[test-groups.windows_sandbox_legacy_sessions]
max-threads = 1

[test-groups.windows_sandbox_accounts]
max-threads = 1

[test-groups.windows_process_heavy]
max-threads = 2

[test-groups.cli_daemon_macos]
# One package copy plus one daemon cold start at a time on the macOS lane.
max-threads = 1

[[profile.default.overrides]]
# Do not add new tests here
filter = 'test(rmcp_client) | test(humanlike_typing_1000_chars_appears_live_no_placeholder)'
slow-timeout = { period = "1m", terminate-after = 4 }

[[profile.default.overrides]]
# This end-to-end case launches several CLI subprocesses and checks cloud policy.
filter = 'package(codex-exec) & test(worktree_start_and_fork_use_host_pool_and_preserve_legacy_resume)'
slow-timeout = { period = "30s", terminate-after = 4 }

[[profile.default.overrides]]
filter = 'test(approval_matrix_covers_all_modes)'
slow-timeout = { period = "30s", terminate-after = 2 }

[[profile.default.overrides]]
filter = 'package(codex-app-server-protocol) & (test(typescript_schema_fixtures_match_generated) | test(json_schema_fixtures_match_generated) | test(generate_ts_with_experimental_api_retains_experimental_entries) | test(generated_ts_optional_nullable_fields_only_in_params) | test(generate_json_filters_experimental_fields_and_methods))'
test-group = 'app_server_protocol_codegen'

[[profile.default.overrides]]
# These integration tests spawn a fresh app-server subprocess per case.
# Keep the library unit tests parallel.
filter = 'package(codex-app-server) & kind(test)'
test-group = 'app_server_integration'

[[profile.local.overrides]]
# Use up to four app-server subprocesses locally. The global nextest pool still
# limits this to the machine's logical CPU count.
filter = 'package(codex-app-server) & kind(test)'
test-group = 'app_server_integration_local'

[[profile.local.overrides]]
filter = 'package(codex-rust-rig-bridge) & (binary(wire) | test(/proxy_version_parity_tests/))'
test-group = 'rig_bridge_wire_local'

[[profile.local.overrides]]
# Route-aware pool tests and their subprocess children each construct fresh
# default reqwest clients whose macOS system-proxy read stalls when many
# platform setups run at once on loaded developer machines.
filter = 'package(codex-http-client) & test(/^route_aware_client_pool/)'
test-group = 'http_client_default_pool_local'

[[profile.local.overrides]]
# Same mechanism: the dual-track and auth-wire subprocesses each build
# reference clients that read system proxy settings synchronously.
filter = 'package(codex-http-client) & test(/resolved_default_(dual_track|auth_wire)_tests/)'
test-group = 'http_client_default_pool_local'


[[profile.default.overrides]]
# These tests exercise full Codex turns and apply_patch execution, and they are
# sensitive to Windows runner process-startup stalls when many cases launch at once.
filter = 'package(codex-core) & kind(test) & test(apply_patch_cli)'
test-group = 'core_apply_patch_cli_integration'

[[profile.default.overrides]]
# These cases share the runner's elevated sandbox accounts. Queue them before
# starting their timeout; their file lock still coordinates other test processes.
platform = 'cfg(windows)'
filter = '''
    (package(codex-core) & binary(windows_sandbox)) |
    (package(codex-exec-server) & test(file_system_elevated_relative_read_denial_uses_policy_cwd)) |
    (package(codex-windows-sandbox) & test(elevated_non_tty_cmd_forwards_env_output_and_exit))
'''
test-group = 'windows_sandbox_accounts'

[[profile.default.overrides]]
# These tests create restricted-token Windows child processes and private desktops.
# Serialize them to avoid exhausting Windows session/global desktop resources in CI.
filter = 'package(codex-windows-sandbox) & test(legacy_)'
test-group = 'windows_sandbox_legacy_sessions'

[[profile.default.overrides]]
# This Codex-home startup path still exceeded the broader Windows-heavy ceiling
# in both Windows full-CI lanes after contention was reduced.
platform = 'cfg(windows)'
filter = 'test(start_thread_uses_all_default_environments_from_codex_home)'
slow-timeout = { period = "1m", terminate-after = 2 }

[[profile.default.overrides]]
# These Windows-heavy tests spawn subprocesses, session files, or JSON-RPC
# clients and have been the dominant source of 30s full-CI timeouts.
platform = 'cfg(windows)'
filter = 'test(suite::resume::) | test(suite::cli_stream::) | test(suite::auth_env::) | test(start_thread_uses_all_default_environments_from_codex_home) | test(connect_stdio_command_initializes_json_rpc_client_on_windows)'
test-group = 'windows_process_heavy'
slow-timeout = { period = "45s", terminate-after = 2 }

[[profile.default.overrides]]
# These two image cases were measured at 45.351s and 47.057s on the Windows
# full-CI lane (passing, flagged SLOW), so a slightly slower lane pushes them
# past the default 30s x2 kill. Nothing on their path changed between the two
# lanes; give them the same window the other Windows-heavy unit cases get.
platform = 'cfg(windows)'
filter = 'test(detail_policies_apply_the_expected_budgets) | test(legitimately_large_dimensions_still_decode)'
slow-timeout = { period = "1m", terminate-after = 2 }

[[profile.default.overrides]]
# Every leg of this case reads with DEFAULT_READ_TIMEOUT = 60s
# (app-server/tests/suite/v2/account.rs:74), exactly the default 30s x2 kill
# window, so the five legs that timed out on ubuntu and macOS could only ever
# report TIMEOUT with no diagnostics. Let its own deadline fire first and name
# the leg that hangs.
filter = 'test(external_auth_refreshes_on_unauthorized::discovery)'
slow-timeout = { period = "1m", terminate-after = 2 }

[[profile.default.overrides]]
# The elevated Git-approval leg waits 120s inside the test
# (core/tests/windows_sandbox.rs:1400), past the default kill and past a 1m x2
# window. Give that in-test deadline room to fire so a stall reports which
# event never arrived instead of an unexplained TIMEOUT.
platform = 'cfg(windows)'
filter = 'package(codex-core) & binary(windows_sandbox)'
slow-timeout = { period = "1m", terminate-after = 3 }

[[profile.default.overrides]]
# Measured 52.614s PASS on the Windows lane one run earlier, i.e. 7s under the
# default kill, and the case has no in-test deadline at all: a TIMEOUT here can
# never carry diagnostics. Three retry attempts over >2 MiB of metadata is the
# cost; the same lane already grants this shape to the other Windows-heavy
# unit cases.
platform = 'cfg(windows)'
filter = 'test(local_compaction_retries_preserve_instructions_and_tool_metadata)'
slow-timeout = { period = "1m", terminate-after = 2 }

[[profile.default.overrides]]
# macOS only: these binaries copy a full debug package and cold-start a daemon
# while the rest of the 315-binary workspace competes for the same four cores.
# The same legs measured 28.731s and 37.521s in one lane and 46.09s in the next,
# straddling the 45s in-test deadline at cli/tests/daemon_startup.rs:393, and
# the 1m x2 / 1m x3 windows above were both consumed without producing a
# result. Serialize them on macOS; ubuntu keeps its current concurrency.
platform = 'cfg(target_os = "macos")'
filter = 'package(codex-cli) & (binary(app_server_daemon) | binary(daemon_startup))'
test-group = 'cli_daemon_macos'


# ─── Fork live-test configuration ─────────────────────────────────────────
# Live tests hit real vendor accounts with hard limits (measured 2026-09-24):
#   - MiMo: account-level CONCURRENCY limit of 5 ("concurrency reached,
#     current: 6, limit: 5") — a single codex-exec process already opens
#     several connections, so test-level concurrency multiplies past it
#   - GLM coding plan: request-FREQUENCY quota (code 1302) — burst-running
#     the whole matrix in under a minute trips it
#
# Strategy: per-vendor groups (serial within a vendor's own account,
# parallel across vendors), generous slow-timeout for live turns, retries
# with backoff. NOTE: this must live under codex-rs/ (the cargo workspace
# root) — a copy at the repository root is silently ignored by nextest.

[test-groups.live-mimo]
max-threads = 1

[test-groups.live-glm]
max-threads = 1

[test-groups.live-step]
max-threads = 1

# Each binary compaction/search scene runs two subprocess turns. Their inner
# deadlines are 300s each, with bounded pipe draining and receipt verification
# outside those deadlines. Let the scene persist its own timeout evidence.
[[profile.default.overrides]]
filter = 'package(codex-live-tests) and binary(exec_live) and test(/^(mimo|glm|step)_(compact_.*|websearch_.*)$/)'
slow-timeout = { period = "90s", terminate-after = 8 }

[[profile.default.overrides]]
filter = 'package(codex-live-tests) and test(~mimo)'
test-group = "live-mimo"
slow-timeout = { period = "90s", terminate-after = 4 }
retries = { count = 3, backoff = "exponential", delay = "15s" }

[[profile.default.overrides]]
filter = 'package(codex-live-tests) and test(~glm)'
test-group = "live-glm"
slow-timeout = { period = "90s", terminate-after = 4 }
retries = { count = 3, backoff = "exponential", delay = "15s" }

[[profile.default.overrides]]
filter = 'package(codex-live-tests) and test(~step)'
test-group = "live-step"
slow-timeout = { period = "90s", terminate-after = 4 }
retries = { count = 3, backoff = "exponential", delay = "15s" }

# CI profile used by .github/workflows/live-tests.yml.
[profile.ci]
inherits = "default"
# Don't cancel the remaining matrix on the first vendor hiccup.
fail-fast = false
final-status-level = "flaky"
