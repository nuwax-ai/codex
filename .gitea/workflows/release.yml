name: release-gitea

# Gitea-side port of .github/workflows/release.yml. The GitHub workflow is
# untouched and stays the official release path until this one is proven.
#
# Design constraints found by running it on the real host (2026-11-06):
#   * Jobs run in HOST mode (runs-on: linux-host / macos-host / windows-host).
#     Container jobs cannot see the host artifact directory, cannot resolve the
#     instance by its compose service name, and this network blocks github.com
#     inside containers, so `uses: actions/checkout` and `upload-artifact` are
#     unusable. Host mode makes artifacts, caches and pre-seeded archives plain
#     host paths.
#   * No GitHub actions at all: checkout is `git clone` against the instance,
#     Zig is downloaded by shell, artifacts are copied to $CI_ARTIFACTS_DIR.
#   * Rust toolchain, Zig and the cargo mirror are pre-installed on the host by
#     scripts/gitea-ci/install-host-runner.sh; each job only puts them on PATH.
#   * rusty_v8 archives come from a host directory (GitHub Releases is
#     unreachable from this network); see scripts/gitea-ci/README.md.
#
# Trigger with a tag: git tag v0.18.30 && git push origin v0.18.30

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to build (e.g. v0.18.29); defaults to the pushed tag"
        required: false

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-host
            target: aarch64-apple-darwin
            ext: ""
          - runner: macos-host
            target: x86_64-apple-darwin
            ext: ""
          - runner: linux-host
            target: x86_64-unknown-linux-gnu
            ext: ""
          - runner: linux-host
            target: x86_64-unknown-linux-musl
            ext: ""
          - runner: linux-host
            target: aarch64-unknown-linux-musl
            ext: ""
          # Windows runner is not registered yet (`windows-host`). Uncomment
          # once scripts/gitea-ci/install-windows-runner.ps1 has run on the box.
          # - runner: windows-host
          #   target: x86_64-pc-windows-msvc
          #   ext: ".exe"
          # - runner: windows-host
          #   target: aarch64-pc-windows-msvc
          #   ext: ".exe"
    runs-on: ${{ matrix.runner }}
    steps:
      # Gitea does not expose `needs.<job>.outputs` here (it evaluated to an
      # empty string and the checkout got `--branch ""`), so every job derives
      # the version from the tag that triggered it.
      - name: Resolve version
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-${GITHUB_REF_NAME}}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a stable tag: $tag" >&2; exit 1; }
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"

      # No actions/checkout: job containers have no GitHub access on this
      # network, and host mode makes a plain clone the simplest option.
      - name: Check out the tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          server="${GITHUB_SERVER_URL%/}"; host="${server#http://}"; host="${host#https://}"
          auth=""; [ -n "${GH_TOKEN:-}" ] && auth="oauth2:${GH_TOKEN}@"
          rm -rf ./* ./.git 2>/dev/null || true
          git clone --depth 1 --branch "${TAG}" "http://${auth}${host}/${GITHUB_REPOSITORY}.git" .

      # Host-mode runners keep their state on a big disk, but the layout
      # differs per OS (the Linux box has /data/nvme*, the Macs use $HOME).
      - name: Resolve CI paths
        shell: bash
        run: |
          set -euo pipefail
          # `uname -s` rather than runner.os: Gitea's runner.os does not match
          # the GitHub casing here, and a wrong match silently picked the macOS
          # layout on the Linux box.
          case "$(uname -s)" in
            Linux)
              root=/data/nvme1/gitea-ci; cache=/data/nvme0/ci-cache
              cargo_home="$root/toolchain/cargo"; rustup_home="$root/toolchain/rustup"
              zig_dir="$root/toolchain/zig"
              ;;
            Darwin)
              root="$HOME/ci"; cache="$HOME/ci-cache"
              cargo_home="$HOME/ci-toolchain/cargo"; rustup_home="$HOME/ci-toolchain/rustup"
              zig_dir="$HOME/ci-toolchain/zig"
              ;;
            *)
              root="$HOME/ci"; cache="$HOME/ci-cache"
              cargo_home="$HOME/ci-toolchain/cargo"; rustup_home="$HOME/ci-toolchain/rustup"
              zig_dir="$HOME/ci-toolchain/zig"
              ;;
          esac
          mkdir -p "$root/artifacts" "$cache/rusty_v8"
          {
            echo "CI_DATA_ROOT=$root"
            echo "CI_CACHE_ROOT=$cache"
            echo "CARGO_HOME=$cargo_home"
            echo "RUSTUP_HOME=$rustup_home"
            echo "CI_ZIG_DIR=$zig_dir"
            echo "CARGO_TARGET_DIR=$cache/target/${{ matrix.target }}"
            echo "ARTIFACTS_DIR=$root/artifacts"
          } >> "$GITHUB_ENV"

      - name: Put the host toolchain on PATH
        shell: bash
        run: |
          set -euo pipefail
          for d in "${CARGO_HOME}/bin" "${CI_ZIG_DIR}"; do
            [ -d "$d" ] || { echo "missing toolchain dir: $d (run scripts/gitea-ci/install-host-runner.sh)" >&2; exit 1; }
            echo "$d" >> "$GITHUB_PATH"
          done

      - name: Runner inventory
        shell: bash
        run: bash scripts/gitea-ci/runner-inventory.sh

      - name: Rust target
        shell: bash
        run: |
          set -euo pipefail
          rustup target list --installed | grep -qx "${{ matrix.target }}" ||
            rustup target add --toolchain "$(rustc --version | awk '{print $2}')" "${{ matrix.target }}"
          rustc --version

      - name: Linux build dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          command -v pkg-config >/dev/null || { echo "pkg-config is required (apt-get install pkg-config libcap-dev)" >&2; exit 1; }

      - name: Windows long paths
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: git config --global core.longpaths true

      - name: musl build tools
        if: ${{ contains(matrix.target, 'unknown-linux-musl') }}
        shell: bash
        run: |
          set -euo pipefail
          zig version
          bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"

      - name: Configure rusty_v8 from the host archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # Pre-seeded by scripts/gitea-ci/fetch-rusty-v8.sh: GitHub Releases is
          # not reachable from this network.
          base="${CI_CACHE_ROOT}/rusty_v8/${TARGET}"
          [ -d "$base" ] || { echo "missing ${base}; run scripts/gitea-ci/fetch-rusty-v8.sh --target ${TARGET}" >&2; exit 1; }
          archive="$(find "$base" -maxdepth 1 -name '*.a.gz' -o -maxdepth 1 -name '*.lib.gz' | head -1)"
          binding="$(find "$base" -maxdepth 1 -name 'src_binding_*.rs' | head -1)"
          [ -n "$archive" ] && [ -n "$binding" ] || { echo "incomplete V8 pair in ${base}" >&2; exit 1; }
          echo "RUSTY_V8_ARCHIVE=${archive}" >> "$GITHUB_ENV"
          echo "RUSTY_V8_SRC_BINDING_PATH=${binding}" >> "$GITHUB_ENV"

      - name: Build bwrap and export digest
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo build --target ${{ matrix.target }} --release --bin bwrap
          digest="$(sha256sum "${CARGO_TARGET_DIR}/${{ matrix.target }}/release/bwrap" | awk '{print $1}')"
          echo "CODEX_BWRAP_SHA256=${digest}" >> "$GITHUB_ENV"

      - name: Stamp release version
        shell: bash
        run: |
          set -euo pipefail
          sed -i.bak -E 's/^version = "0\.0\.0"$/version = "'"${VERSION}"'"/' Cargo.toml
          rm -f Cargo.toml.bak

      - name: Build main binary and Code Mode host
        shell: bash
        run: |
          set -euo pipefail
          cargo build --target ${{ matrix.target }} --release \
            -p codex-cli --bin codex \
            -p codex-code-mode-host --bin codex-code-mode-host

      - name: Build Windows sandbox helpers
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo build --target ${{ matrix.target }} --release \
            -p codex-windows-sandbox \
            --bin codex-windows-sandbox-setup --bin codex-command-runner

      - name: Strip
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail
          for name in codex codex-code-mode-host; do
            bin="${CARGO_TARGET_DIR}/${{ matrix.target }}/release/${name}"
            if [ "${{ runner.os }}" = "Linux" ]; then strip "$bin"; else strip -x "$bin"; fi
          done

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${ARTIFACTS_DIR}"
          python3 "${GITHUB_WORKSPACE}/.github/scripts/package_nuwax_release.py" \
            --build-dir "${CARGO_TARGET_DIR}/${{ matrix.target }}/release" \
            --output-dir "${ARTIFACTS_DIR}" \
            --version "${VERSION}" \
            --target "${{ matrix.target }}" \
            --github-output "${GITHUB_OUTPUT}"
          ls -la "${ARTIFACTS_DIR}"

  # Publishing (OSS upload + npm publish) stays manual until the archives above
  # are verified: this pipeline is new, and a half-built release must not reach
  # a registry. See .github/workflows/release.yml for the OSS layout.
  verify-artifacts:
    name: verify artifacts
    needs: [build]
    runs-on: linux-host
    steps:
      - name: Check the artifact set
        shell: bash
        env:
          ARTIFACTS_DIR: /data/nvme1/gitea-ci/artifacts
          REQUESTED_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-${GITHUB_REF_NAME}}"
          VERSION="${tag#v}"
          export VERSION
          set -euo pipefail
          ls -la "${ARTIFACTS_DIR}"
          count="$(find "${ARTIFACTS_DIR}" -maxdepth 1 \( -name '*'"${VERSION}"'*.tar.gz' -o -name '*'"${VERSION}"'*.zip' \) | wc -l)"
          echo "archives for ${VERSION}: ${count}"
          # macOS archives land on the Mac runner's own disk; the Linux host
          # collects the three Linux targets. Raise this to 7 once the Windows
          # runner exists and archives are gathered in one place.
          [ "${count}" -ge 3 ] || { echo "expected the 3 linux archives, found ${count}" >&2; exit 1; }
