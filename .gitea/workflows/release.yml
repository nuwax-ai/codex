name: release-gitea

# Gitea-side port of .github/workflows/release.yml. The GitHub workflow is
# untouched and stays the official release path until this one is proven.
#
# Design constraints found by running it on the real host (2026-11-06):
#   * Jobs run in HOST mode (runs-on: linux-host / macos-host / windows-host).
#     Container jobs cannot see the host artifact directory, cannot resolve the
#     instance by its compose service name, and this network blocks github.com
#     inside containers, so `uses: actions/checkout` and `upload-artifact` are
#     unusable. Host mode makes artifacts, caches and pre-seeded archives plain
#     host paths.
#   * No GitHub actions at all: checkout is `git clone` against the instance,
#     Zig is downloaded by shell, artifacts are copied to $CI_ARTIFACTS_DIR.
#   * Rust toolchain, Zig and the cargo mirror are pre-installed on the host by
#     scripts/gitea-ci/install-host-runner.sh; each job only puts them on PATH.
#   * rusty_v8 archives come from a host directory (GitHub Releases is
#     unreachable from this network); see scripts/gitea-ci/README.md.
#
# Trigger with a tag: git tag v0.18.30 && git push origin v0.18.30

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to build (e.g. v0.18.29); defaults to the pushed tag"
        required: false

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-host
            target: aarch64-apple-darwin
            ext: ""
          - runner: macos-host
            target: x86_64-apple-darwin
            ext: ""
          - runner: linux-host
            target: x86_64-unknown-linux-gnu
            ext: ""
          - runner: linux-host
            target: x86_64-unknown-linux-musl
            ext: ""
          - runner: linux-host
            target: aarch64-unknown-linux-musl
            ext: ""
          - runner: windows-host
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - runner: windows-host
            target: aarch64-pc-windows-msvc
            ext: ".exe"
    runs-on: ${{ matrix.runner }}
    steps:
      # Gitea does not expose `needs.<job>.outputs` here (it evaluated to an
      # empty string and the checkout got `--branch ""`), so every job derives
      # the version from the tag that triggered it.
      - name: Resolve version
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-${GITHUB_REF_NAME}}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a stable tag: $tag" >&2; exit 1; }
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"

      # No actions/checkout: job containers have no GitHub access on this
      # network, and host mode makes a plain clone the simplest option.
      - name: Check out the tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A runner that cannot reach the instance on the configured address
          # (this Windows box is on another subnet) may set CI_GITEA_BASE.
          server="${CI_GITEA_BASE:-${GITHUB_SERVER_URL%/}}"
          host="${server#http://}"; host="${host#https://}"
          auth=""; [ -n "${GH_TOKEN:-}" ] && auth="oauth2:${GH_TOKEN}@"
          url="http://${auth}${host}/${GITHUB_REPOSITORY}.git"
          rm -rf ./* ./.git 2>/dev/null || true
          if git clone --depth 1 --branch "${TAG}" "${url}" . 2>/tmp/clone.err; then
            echo "checked out ${TAG} with git"
          else
            # macOS runners refuse the git connection even though curl to the
            # very same instance answers 200 (Local Network privacy applies per
            # binary). The archive API is the way in.
            echo "git clone failed, falling back to the archive API:"
            sed -n '1,4p' /tmp/clone.err
            curl -fsSL -H "Authorization: token ${GH_TOKEN}" \
              "${server}/api/v1/repos/${GITHUB_REPOSITORY}/archive/${TAG}.tar.gz" \
              | tar -xz --strip-components=1
            echo "checked out ${TAG} from the API archive"
          fi

      # Host-mode runners keep their state on a big disk, but the layout
      # differs per OS (the Linux box has /data/nvme*, the Macs use $HOME).
      - name: Resolve CI paths
        shell: bash
        run: |
          set -euo pipefail
          # `uname -s` rather than runner.os: Gitea's runner.os does not match
          # the GitHub casing here, and a wrong match silently picked the macOS
          # layout on the Linux box.
          case "$(uname -s)" in
            Linux)
              # Each Linux runner exports where its disks are (the box that
              # hosts Gitea uses /data/nvme*; the others use /srv/ci).
              root="${CI_DATA_ROOT:-/data/nvme1/gitea-ci}"
              cache="${CI_CACHE_ROOT:-/data/nvme0/ci-cache}"
              cargo_home="${CI_CARGO_HOME:-$root/toolchain/cargo}"
              rustup_home="${CI_RUSTUP_HOME:-$root/toolchain/rustup}"
              zig_dir="${CI_ZIG_DIR:-$root/toolchain/zig}"
              ;;
            Darwin)
              root="$HOME/ci"; cache="$HOME/ci-cache"
              cargo_home="$HOME/ci-toolchain/cargo"; rustup_home="$HOME/ci-toolchain/rustup"
              zig_dir="$HOME/ci-toolchain/zig"
              ;;
            MINGW*|MSYS*|CYGWIN*)
              root="C:/ci"; cache="C:/ci/cache"
              cargo_home="$HOME/.cargo"; rustup_home="$HOME/.rustup"
              zig_dir="$root/toolchain/zig"
              ;;
            *)
              root="$HOME/ci"; cache="$HOME/ci-cache"
              cargo_home="$HOME/ci-toolchain/cargo"; rustup_home="$HOME/ci-toolchain/rustup"
              zig_dir="$HOME/ci-toolchain/zig"
              ;;
          esac
          mkdir -p "$root/artifacts" "$cache/rusty_v8"
          {
            echo "CI_DATA_ROOT=$root"
            echo "CI_CACHE_ROOT=$cache"
            echo "CARGO_HOME=$cargo_home"
            echo "RUSTUP_HOME=$rustup_home"
            echo "CI_ZIG_DIR=$zig_dir"
            echo "CARGO_TARGET_DIR=$cache/target/${{ matrix.target }}"
            echo "ARTIFACTS_DIR=$root/artifacts"
          } >> "$GITHUB_ENV"

      - name: Put the host toolchain on PATH
        shell: bash
        run: |
          set -euo pipefail
          [ -d "${CARGO_HOME}/bin" ] || {
            echo "missing ${CARGO_HOME}/bin (run scripts/gitea-ci/install-host-runner.sh)" >&2
            exit 1
          }
          echo "${CARGO_HOME}/bin" >> "$GITHUB_PATH"
          # Zig is only needed for the musl targets, which only the Linux host
          # builds; on macOS/Windows the directory simply does not exist.
          if [ -d "${CI_ZIG_DIR}" ]; then
            echo "${CI_ZIG_DIR}" >> "$GITHUB_PATH"
          fi
          # aarch64 musl is cross-compiled on an x86 host: the musl tools script
          # prefers <arch>-linux-musl-gcc over the host musl-gcc.
          if [ -d "${CI_DATA_ROOT}/tools/aarch64-linux-musl-cross/bin" ]; then
            echo "${CI_DATA_ROOT}/tools/aarch64-linux-musl-cross/bin" >> "$GITHUB_PATH"
          fi

      - name: Runner inventory
        shell: bash
        run: bash scripts/gitea-ci/runner-inventory.sh

      - name: Rust target
        shell: bash
        run: |
          set -euo pipefail
          rustup target list --installed | grep -qx "${{ matrix.target }}" ||
            rustup target add --toolchain "$(rustc --version | awk '{print $2}')" "${{ matrix.target }}"
          rustc --version

      - name: Linux build dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          command -v pkg-config >/dev/null || { echo "pkg-config is required (apt-get install pkg-config libcap-dev)" >&2; exit 1; }

      - name: Windows long paths
        if: ${{ contains(matrix.target, 'windows') }}
        shell: bash
        run: git config --global core.longpaths true

      - name: musl build tools
        if: ${{ contains(matrix.target, 'unknown-linux-musl') }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          # github.com is not reachable from these hosts; the tarball is mirrored
          # in the same bucket the archives go to (the script still verifies the
          # pinned sha256).
          OPENSSL_SOURCE_URL: https://s3.nuwax.com:9443/nuwax-packages/ci-gitea/deps/openssl-3.6.4.tar.gz
        run: |
          set -euo pipefail
          zig version
          # Several jobs share one host here, and two apt-get runs at once die on
          # the dpkg lock. Serialize the package installation per machine.
          flock /tmp/codex-musl-tools.lock \
            bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"

      - name: Configure rusty_v8 from the host archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # Pre-seeded by scripts/gitea-ci/fetch-rusty-v8.sh: GitHub Releases is
          # not reachable from this network.
          base="${CI_CACHE_ROOT}/rusty_v8/${TARGET}"
          [ -d "$base" ] || { echo "missing ${base}; run scripts/gitea-ci/fetch-rusty-v8.sh --target ${TARGET}" >&2; exit 1; }
          archive="$(find "$base" -maxdepth 1 \( -name '*.a.gz' -o -name '*.lib.gz' \) | head -1)"
          binding="$(find "$base" -maxdepth 1 -name 'src_binding_*.rs' | head -1)"
          [ -n "$archive" ] && [ -n "$binding" ] || { echo "incomplete V8 pair in ${base}" >&2; exit 1; }
          echo "RUSTY_V8_ARCHIVE=${archive}" >> "$GITHUB_ENV"
          echo "RUSTY_V8_SRC_BINDING_PATH=${binding}" >> "$GITHUB_ENV"

      - name: Build bwrap and export digest
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/codex-rs"
          cargo build --target ${{ matrix.target }} --release --bin bwrap
          digest="$(sha256sum "${CARGO_TARGET_DIR}/${{ matrix.target }}/release/bwrap" | awk '{print $1}')"
          echo "CODEX_BWRAP_SHA256=${digest}" >> "$GITHUB_ENV"

      - name: Stamp release version
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/codex-rs"
          sed -i.bak -E 's/^version = "0\.0\.0"$/version = "'"${VERSION}"'"/' Cargo.toml
          rm -f Cargo.toml.bak

      - name: Build main binary and Code Mode host
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            *windows*)
              # Needs the VS developer environment for the C dependencies.
              cmd //c "scripts\\gitea-ci\\win-build.cmd" "${{ matrix.target }}" \
                --release -p codex-cli --bin codex \
                -p codex-code-mode-host --bin codex-code-mode-host
              ;;
            *)
              cd "${GITHUB_WORKSPACE}/codex-rs"
              cargo build --target ${{ matrix.target }} --release \
                -p codex-cli --bin codex \
                -p codex-code-mode-host --bin codex-code-mode-host
              ;;
          esac

      - name: Build Windows sandbox helpers
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            *windows*)
              cmd //c "scripts\\gitea-ci\\win-build.cmd" "${{ matrix.target }}" \
                --release -p codex-windows-sandbox \
                --bin codex-windows-sandbox-setup --bin codex-command-runner
              ;;
            *) echo "not a Windows target"; ;;
          esac

      - name: Strip
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            *windows*) echo "no strip for ${{ matrix.target }}"; exit 0 ;;
          esac
          for name in codex codex-code-mode-host; do
            bin="${CARGO_TARGET_DIR}/${{ matrix.target }}/release/${name}"
            if [ "${{ runner.os }}" = "Linux" ]; then strip "$bin"; else strip -x "$bin"; fi
          done

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${ARTIFACTS_DIR}"
          python3 "${GITHUB_WORKSPACE}/.github/scripts/package_nuwax_release.py" \
            --build-dir "${CARGO_TARGET_DIR}/${{ matrix.target }}/release" \
            --output-dir "${ARTIFACTS_DIR}" \
            --version "${VERSION}" \
            --target "${{ matrix.target }}" \
            --github-output "${GITHUB_OUTPUT}"
          ls -la "${ARTIFACTS_DIR}"

      # Each runner publishes its own archive so the artifacts are reachable
      # from anywhere, instead of living on whichever machine built them.
      - name: Upload the archive
        shell: bash
        env:
          S3_BASE: https://s3.nuwax.com:9443/nuwax-packages
          S3_AK: ${{ secrets.NUWAX_UPLOAD_ACCESS_KEY }}
          S3_SK: ${{ secrets.NUWAX_UPLOAD_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${S3_AK:-}" ] || [ -z "${S3_SK:-}" ]; then
            echo "no S3 credentials configured; keeping the archive local"
            exit 0
          fi
          tool="$(command -v nuwax-upload || true)"
          if [ -z "${tool}" ]; then
            for candidate in "${CI_DATA_ROOT}/bin/nuwax-upload" \
                             "$HOME/ci/bin/nuwax-upload" \
                             "$HOME/.npm-global/bin/nuwax-upload" \
                             "$HOME/AppData/Roaming/npm/nuwax-upload.cmd"; do
              [ -x "${candidate}" ] && tool="${candidate}" && break
            done
          fi
          [ -n "${tool}" ] || { echo "nuwax-upload is not installed on this runner" >&2; exit 1; }
          archive="$(ls "${ARTIFACTS_DIR}"/nuwax-codex-"${VERSION}"-"${{ matrix.target }}".* | head -1)"
          # A host runs several jobs against the same ARTIFACTS_DIR, so the
          # entry must not live there: it would be overwritten by a sibling job.
          entry="$(mktemp -d)/entry.json"
          python3 "${GITHUB_WORKSPACE}/scripts/gitea-ci/release-manifest.py" entry \
            --archive "${archive}" \
            --version "${VERSION}" \
            --target "${{ matrix.target }}" \
            --base-url "${S3_BASE}/ci-gitea/${VERSION}/${{ matrix.target }}" \
            --out "${entry}"
          "${tool}" --access-key "${S3_AK}" --secret-key "${S3_SK}" \
            --prefix "ci-gitea/${VERSION}/${{ matrix.target }}" \
            "${archive}" "${entry}"

  # Publishing (OSS upload + npm publish) stays manual until the archives above
  # are verified: this pipeline is new, and a half-built release must not reach
  # a registry. See .github/workflows/release.yml for the OSS layout.
  verify-artifacts:
    name: verify artifacts
    needs: [build]
    runs-on: linux-host
    env:
      S3_BASE: https://s3.nuwax.com:9443/nuwax-packages
      REQUESTED_TAG: ${{ inputs.tag_name }}
    steps:
      # The manifest is assembled by the helper script in the repository.
      - name: Check out the tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-${GITHUB_REF_NAME}}"
          server="${CI_GITEA_BASE:-${GITHUB_SERVER_URL%/}}"
          host="${server#http://}"; host="${host#https://}"
          auth=""; [ -n "${GH_TOKEN:-}" ] && auth="oauth2:${GH_TOKEN}@"
          rm -rf ./* ./.git 2>/dev/null || true
          git clone --depth 1 --branch "${tag}" "http://${auth}${host}/${GITHUB_REPOSITORY}.git" .

      - name: Verify the archives and publish manifest.json
        shell: bash
        env:
          S3_AK: ${{ secrets.NUWAX_UPLOAD_ACCESS_KEY }}
          S3_SK: ${{ secrets.NUWAX_UPLOAD_SECRET_KEY }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-${GITHUB_REF_NAME}}"
          version="${tag#v}"
          targets=(aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu \
                   x86_64-unknown-linux-musl aarch64-unknown-linux-musl \
                   x86_64-pc-windows-msvc aarch64-pc-windows-msvc)
          entries="$(mktemp -d)"
          found=0
          for t in "${targets[@]}"; do
            ext=tar.gz; case "$t" in *windows*) ext=zip ;; esac
            url="${S3_BASE}/ci-gitea/${version}/${t}/nuwax-codex-${version}-${t}.${ext}"
            code="$(curl -s -o /dev/null -w '%{http_code}' -I --max-time 30 "$url" || echo 000)"
            echo "$t -> HTTP $code"
            if [ "$code" = "200" ]; then
              found=$((found + 1))
              curl -fsS --max-time 30 "${S3_BASE}/ci-gitea/${version}/${t}/entry.json" \
                -o "${entries}/${t}.json"
            fi
          done
          echo "archives reachable: ${found}/${#targets[@]}"
          [ "${found}" -ge "${#targets[@]}" ] || {
            echo "expected all ${#targets[@]} platform archives on S3" >&2
            exit 1
          }

          python3 scripts/gitea-ci/release-manifest.py assemble \
            --entries "${entries}" \
            --version "${version}" \
            --tag "${tag}" \
            --base-url "${S3_BASE}/ci-gitea/${version}" \
            --repository "${GITHUB_REPOSITORY:-}" \
            --commit "${GITHUB_SHA:-}" \
            --out "${entries}/manifest.json"

          if [ -z "${S3_AK:-}" ] || [ -z "${S3_SK:-}" ]; then
            echo "no S3 credentials configured; manifest left at ${entries}/manifest.json"
            exit 0
          fi
          tool="$(command -v nuwax-upload || true)"
          if [ -z "${tool}" ]; then
            for candidate in /data/nvme1/gitea-ci/bin/nuwax-upload \
                             "${HOME}/ci/data/bin/nuwax-upload" \
                             "${HOME}/.npm-global/bin/nuwax-upload"; do
              [ -x "${candidate}" ] && tool="${candidate}" && break
            done
          fi
          [ -n "${tool}" ] || { echo "nuwax-upload is not installed on this runner" >&2; exit 1; }
          "${tool}" --access-key "${S3_AK}" --secret-key "${S3_SK}" \
            --prefix "ci-gitea/${version}" "${entries}/manifest.json"
          echo "manifest: ${S3_BASE}/ci-gitea/${version}/manifest.json"
