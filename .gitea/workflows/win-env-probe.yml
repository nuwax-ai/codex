name: win-env-probe
on:
  push:
jobs:
  probe:
    runs-on: windows-host
    steps:
      - name: Where am I
        shell: powershell
        run: |
          "user=$env:USERNAME host=$env:COMPUTERNAME pwd=$(Get-Location)"
          "CI_GITEA_BASE=$env:CI_GITEA_BASE"
          "PATH has git: " + [bool]($env:PATH -split ';' | Where-Object { $_ -like '*Git*' })
      - name: bash available?
        shell: powershell
        run: |
          foreach ($c in 'bash','python3','python','tar','git','rustc','cargo') {
            $p = (Get-Command $c -ErrorAction SilentlyContinue).Source
            "$c = " + ($(if ($p) { $p } else { 'MISSING' }))
          }
