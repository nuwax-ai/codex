name: smoke

# Fast Gitea-side pipeline: proves a runner is reachable and that the
# toolchain inventory this fork's real build needs is present. It intentionally
# keeps its dependencies tiny so a fresh machine runs it in about a minute.
#
# Kept separate from .github/workflows/ so the GitHub release CI is untouched.

on:
  push:
  workflow_dispatch:

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      # No actions/checkout: a Gitea runner may sit behind a network that
      # cannot reach github.com, and the checkout is two lines of git anyway.
      - name: Check out
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          server="${GITHUB_SERVER_URL%/}"
          host="${server#http://}"
          host="${host#https://}"
          auth=""
          if [ -n "${GH_TOKEN:-}" ]; then auth="oauth2:${GH_TOKEN}@"; fi
          url="http://${auth}${host}/${GITHUB_REPOSITORY}.git"
          echo "cloning ${GITHUB_REPOSITORY} @ ${GITHUB_REF_NAME}"
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" "${url}" .

      - name: Toolchain inventory
        shell: bash
        run: bash scripts/gitea-ci/runner-inventory.sh

      - name: Workflow context
        shell: bash
        run: |
          set -euo pipefail
          echo "server:   ${GITHUB_SERVER_URL:-unset}"
          echo "repo:     ${GITHUB_REPOSITORY:-unset}"
          echo "sha:      ${GITHUB_SHA:-unset}"
          echo "ref:      ${GITHUB_REF_NAME:-unset}"
          echo "workspace: ${GITHUB_WORKSPACE:-unset}"
