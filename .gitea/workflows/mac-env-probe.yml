name: mac-env-probe
on:
  push:
jobs:
  probe:
    runs-on: macos-host
    steps:
      - name: Environment
        shell: bash
        run: |
          set -euo pipefail
          echo "user=$(id -un) host=$(hostname) pwd=$(pwd)"
          echo "server_url=${GITHUB_SERVER_URL}"
          env | grep -iE 'proxy|no_proxy' || echo "no proxy vars"
      - name: Reach the instance
        shell: bash
        run: |
          set -euo pipefail
          curl -m 5 -s -o /dev/null -w "healthz:%{http_code} in %{time_total}s\n" http://192.168.31.23:3301/api/healthz || echo "curl failed rc=$?"
          curl -m 5 -s -o /dev/null -w "git-endpoint:%{http_code}\n" "http://192.168.31.23:3301/ci/codex.git/info/refs?service=git-upload-pack" || echo "curl failed rc=$?"
          git ls-remote "http://ci:ci-local-test-only@192.168.31.23:3301/ci/codex.git" HEAD 2>&1 | head -3 || echo "ls-remote failed rc=$?"
