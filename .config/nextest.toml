# nextest configuration for the codex workspace fork.
#
# Live tests hit real vendor accounts with hard limits (measured 2026-09-24):
#   - MiMo: account-level CONCURRENCY limit of 5 (error: "concurrency
#     reached, current: 6, limit: 5") — a single codex-exec process already
#     opens several connections, so test-level concurrency multiplies past it
#   - GLM coding plan: request-FREQUENCY quota (code 1302) — burst-running
#     the whole matrix in under a minute trips it
#
# Strategy: per-vendor groups, serial within a vendor (its own account never
# sees concurrent test traffic), parallel across vendors. Add one group +
# override per new vendor (test names carry the vendor prefix).

[[test-group]]
name = "live-mimo"
max-threads = 1

[[test-group]]
name = "live-glm"
max-threads = 1

[[test-group]]
name = "live-step"
max-threads = 1

[[profile.default.overrides]]
filter = 'package(codex-live-tests) and test(~mimo)'
group = "live-mimo"
retries = { count = 3, backoff = "15s" }

[[profile.default.overrides]]
filter = 'package(codex-live-tests) and test(~glm)'
group = "live-glm"
retries = { count = 3, backoff = "15s" }

[[profile.default.overrides]]
filter = 'package(codex-live-tests) and test(~step)'
group = "live-step"
retries = { count = 3, backoff = "15s" }
