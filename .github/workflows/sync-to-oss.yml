# Sync GitHub Release assets to Alibaba Cloud OSS
# Triggered automatically after release workflow completes, or manually.
name: Sync Release to OSS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync (e.g. v0.16.11)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Release tag"
        required: true
        type: string

permissions:
  contents: read

env:
  OSS_ENDPOINT: "https://oss-rg-china-mainland.aliyuncs.com"
  OSS_REGION: "rg-china-mainland"
  OSS_BUCKET: "oss://nuwa-packages"
  OSS_CDN_BASE: "https://nuwa-packages.oss-rg-china-mainland.aliyuncs.com"
  OSS_PREFIX: "nuwax-codex"

jobs:
  sync:
    name: Sync to OSS
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ossutil v2
        run: |
          curl -fSL -o /tmp/ossutil.zip \
            "https://gosspublic.alicdn.com/ossutil/v2/2.2.0/ossutil-2.2.0-linux-amd64.zip"
          unzip -q /tmp/ossutil.zip -d /tmp
          sudo mv /tmp/ossutil-2.2.0-linux-amd64/ossutil /usr/local/bin/
          ossutil version

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN || github.token }}
        run: |
          mkdir -p release_assets
          echo "Downloading assets for tag: ${RELEASE_TAG}"
          gh release download "${RELEASE_TAG}" --repo "$GITHUB_REPOSITORY" --dir release_assets
          echo "Downloaded:"
          ls -la release_assets/

      - name: Upload to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          OSS_PATH="${OSS_PREFIX}/${RELEASE_TAG}"
          echo "Uploading to: ${OSS_CDN_BASE}/${OSS_PATH}/"

          cd release_assets
          for file in *.tar.gz *.zip; do
            if [ -f "$file" ]; then
              echo "Uploading: $file"
              ossutil cp --force "$file" "${OSS_BUCKET}/${OSS_PATH}/${file}" \
                --endpoint "$OSS_ENDPOINT" \
                --region "$OSS_REGION" \
                --access-key-id "$OSS_ACCESS_KEY_ID" \
                --access-key-secret "$OSS_ACCESS_KEY_SECRET"
              echo "  Done: ${OSS_CDN_BASE}/${OSS_PATH}/${file}"
            fi
          done

      - name: Verify OSS upload
        run: |
          for file in release_assets/*.tar.gz release_assets/*.zip; do
            if [ -f "$file" ]; then
              fname=$(basename "$file")
              url="${OSS_CDN_BASE}/${OSS_PREFIX}/${RELEASE_TAG}/${fname}"
              status=$(curl -sS -o /dev/null -w "%{http_code}" "$url")
              if [ "$status" = "200" ] || [ "$status" = "302" ]; then
                echo "  ✅ $fname"
              else
                echo "  ❌ $fname (HTTP $status)"
              fi
            fi
          done
