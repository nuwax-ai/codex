# Nightly / on-demand live matrix for the chat bridges.
#
# Requires repository secrets (Settings → Secrets → Actions); any vendor
# without a key is skipped automatically by the test crate:
#   LIVE_MIMO_API_KEY, LIVE_GLM_API_KEY
#
# Artifacts (logs/) are uploaded on every run, including failures.

name: Live Tests

on:
  workflow_dispatch:
  schedule:
    # 20:10 UTC = 04:10 Beijing, off the :00 mark
    - cron: "10 20 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  live-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Build codex-exec
        run: cargo build -p codex-exec --bin codex-exec

      - name: Run live matrix
        env:
          LIVE_CASSETTE: "off"
          LIVE_VENDORS: ${{ vars.LIVE_VENDORS || 'mimo,glm' }}
          # Complete vendor configuration — vendors() skips entries without
          # URLs/models, so keys alone would silently skip every scenario.
          LIVE_MIMO_API_KEY: ${{ secrets.LIVE_MIMO_API_KEY }}
          LIVE_MIMO_CHAT_URL: https://token-plan-cn.xiaomimimo.com/v1
          LIVE_MIMO_ANTHROPIC_URL: https://token-plan-cn.xiaomimimo.com/anthropic/v1
          LIVE_MIMO_MODEL: mimo-v2.6-flash
          LIVE_GLM_API_KEY: ${{ secrets.LIVE_GLM_API_KEY }}
          LIVE_GLM_CHAT_URL: https://open.bigmodel.cn/api/coding/paas/v4
          LIVE_GLM_ANTHROPIC_URL: https://open.bigmodel.cn/api/anthropic/v1
          LIVE_GLM_RESPONSES_URL: https://open.bigmodel.cn/api/v1
          LIVE_GLM_MODEL: GLM-5.3-Flash
        run: |
          python3 - <<'PY_PREFLIGHT'
          import os
          vendors = [v.strip() for v in os.environ.get("LIVE_VENDORS", "").split(",") if v.strip()]
          if not vendors or any(v not in {"mimo", "glm", "step"} for v in vendors):
              raise SystemExit("LIVE_VENDORS must select at least one of mimo, glm, step")
          missing = [f"LIVE_{v.upper()}_{key}" for v in vendors for key in ("API_KEY", "CHAT_URL", "ANTHROPIC_URL", "MODEL") if not os.environ.get(f"LIVE_{v.upper()}_{key}", "").strip()]
          if missing:
              raise SystemExit("Missing live test configuration: " + ", ".join(missing))
          PY_PREFLIGHT
          cargo nextest run -p codex-live-tests \
            --profile ci \
            --no-fail-fast

      - name: Aggregate artifact index
        if: always()
        run: cargo run -p codex-live-tests --bin index-logs

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-logs-${{ github.run_id }}
          path: logs/
          retention-days: 14
