# Build and publish a stable release of the `nuwax-codex` npm package.
# Triggered by pushing a `v*.*.*` tag (e.g. v0.16.1) or manually via
# workflow_dispatch. Builds the `nuwax-harness` binary (+ bundled `bwrap` on Linux)
# for 7 targets, uploads them to the release/CDN, and publishes the
# `nuwax-codex` umbrella package to the npm `latest` dist-tag.
#
# Pre-release tags (containing "beta" or "alpha") are rejected; use
# release-beta.yml for those instead.
name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for release (e.g. v0.16.1)"
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"
  # Use the system `git` CLI (Homebrew git on macOS) instead of libgit2 to fetch
  # git dependencies. macOS runners fail intermittently with "SecureTransport
  # error" when libgit2 fetches the libwebrtc -> libyuv submodule from
  # googlesource.com; the system git CLI is markedly more reliable here.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  get-version:
    name: Get Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag_name: ${{ steps.get_version.outputs.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Release packaging contracts
        run: python3 -m unittest discover -s .github/scripts -p 'test_package_nuwax_release.py'

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: npm launcher and installation contracts
        env:
          NUWAX_NPM_TEST_NODE_MODULES: ${{ runner.temp }}/nuwax-npm-contracts/node_modules
          NUWAX_NPM_TEST_TMPDIR: ${{ runner.temp }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from "node:fs";
          import { spawnSync } from "node:child_process";
          const dependencies = JSON.parse(readFileSync("npm/package.json", "utf8")).dependencies;
          const packages = Object.entries(dependencies).map(([name, version]) => `${name}@${version}`);
          const result = spawnSync("npm", ["install", "--prefix", `${process.env.RUNNER_TEMP}/nuwax-npm-contracts`, "--ignore-scripts", "--no-audit", "--no-fund", ...packages], { stdio: "inherit" });
          process.exit(result.status ?? 1);
          JS
          node --test scripts/test_nuwax_npm_package.mjs

      - name: Get version from tag
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi
          # Strip leading v to get a valid npm semver
          VERSION="${TAG_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Reject pre-release tags
        run: |
          if [[ "$VERSION" == *"beta"* ]] || [[ "$VERSION" == *"alpha"* ]]; then
            echo "::error::Tag $TAG_NAME is a pre-release. Use release-beta.yml for pre-releases."
            exit 1
          fi
          echo "✅ Stable release version: $VERSION"
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          TAG_NAME: ${{ steps.get_version.outputs.tag_name }}

  build:
    name: Build - ${{ matrix.target }}
    needs: get-version
    # Rust workspace root is codex-rs/; all cargo/shell steps run there.
    defaults:
      run:
        working-directory: codex-rs
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            binary_extension: ""
          - os: macos-14
            target: x86_64-apple-darwin
            binary_extension: ""
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary_extension: ""
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            binary_extension: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary_extension: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_extension: ".exe"
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary_extension: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.get-version.outputs.tag_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --target ${{ matrix.target }} --profile minimal --no-self-update
          rustup default "$toolchain"

      - if: ${{ contains(matrix.target, 'unknown-linux-musl') }}
        name: Use hermetic Cargo home (musl)
        shell: bash
        run: |
          set -euo pipefail
          cargo_home="${GITHUB_WORKSPACE}/.cargo-home"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "$GITHUB_ENV"
          echo "${cargo_home}/bin" >> "$GITHUB_PATH"
          : > "${cargo_home}/config.toml"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ matrix.os }}-${{ matrix.target }}-cargo-registry-${{ hashFiles('codex-rs/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.target }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ matrix.os }}-${{ matrix.target }}-cargo-git-${{ hashFiles('codex-rs/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.target }}-cargo-git-

      - name: Install Linux build dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          for attempt in 1 2 3 4 5; do
            if sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev; then
              break
            fi
            echo "apt install attempt $attempt failed, retrying in 15s..."
            sleep 15
            sudo apt-get update -y
            if [ "$attempt" = "5" ]; then
              echo "apt install failed after 5 attempts" >&2
              exit 1
            fi
          done

      - name: Install UBSan runtime (musl)
        if: ${{ contains(matrix.target, 'unknown-linux-musl') }}
        shell: bash
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libubsan1
          fi

      - if: ${{ contains(matrix.target, 'unknown-linux-musl') }}
        name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0

      - if: ${{ contains(matrix.target, 'unknown-linux-musl') }}
        name: Install musl build tools
        env:
          TARGET: ${{ matrix.target }}
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"

      - name: Setup paired and verified rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - if: ${{ contains(matrix.target, 'unknown-linux-musl') }}
        name: Configure rustc UBSan wrapper (musl host)
        shell: bash
        run: |
          set -euo pipefail
          ubsan=""
          if command -v ldconfig >/dev/null 2>&1; then
            ubsan="$(ldconfig -p | grep -m1 'libubsan\.so\.1' | sed -E 's/.*=> (.*)$/\1/')"
          fi
          wrapper_root="${RUNNER_TEMP:-/tmp}"
          wrapper="${wrapper_root}/rustc-ubsan-wrapper"
          cat > "${wrapper}" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ -n "${ubsan}" ]]; then
            export LD_PRELOAD="${ubsan}\${LD_PRELOAD:+:\${LD_PRELOAD}}"
          fi
          exec "\$1" "\${@:2}"
          EOF
          chmod +x "${wrapper}"
          echo "RUSTC_WRAPPER=${wrapper}" >> "$GITHUB_ENV"
          echo "RUSTC_WORKSPACE_WRAPPER=" >> "$GITHUB_ENV"

      - if: ${{ contains(matrix.target, 'unknown-linux-musl') }}
        name: Clear sanitizer flags (musl)
        shell: bash
        run: |
          set -euo pipefail
          echo "RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_ENCODED_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "RUSTDOCFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=" >> "$GITHUB_ENV"

          sanitize_flags() {
            local input="$1"
            input="${input//-fsanitize=undefined/}"
            input="${input//-fno-sanitize-recover=undefined/}"
            input="${input//-fno-sanitize-trap=undefined/}"
            echo "$input"
          }

          cflags="$(sanitize_flags "${CFLAGS-}")"
          cxxflags="$(sanitize_flags "${CXXFLAGS-}")"
          echo "CFLAGS=${cflags}" >> "$GITHUB_ENV"
          echo "CXXFLAGS=${cxxflags}" >> "$GITHUB_ENV"
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"

      # Build bwrap first and export its digest into CODEX_BWRAP_SHA256.
      # The subsequent codex build picks it up via option_env! in build.rs to
      # verify the bundled bwrap at runtime. Linux only (macOS/Windows sandbox
      # does not use bwrap).
      - name: Build bwrap and export digest (Linux)
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          cargo build --target "$target" --release --bin bwrap
          bwrap_path="target/${target}/release/bwrap"
          if [[ ! -f "$bwrap_path" ]]; then
            echo "bwrap binary ${bwrap_path} not found" >&2
            exit 1
          fi
          digest="$(sha256sum "$bwrap_path" | awk '{print $1}')"
          echo "CODEX_BWRAP_SHA256=${digest}" >> "$GITHUB_ENV"
          echo "Built bwrap ${bwrap_path} with sha256:${digest}"

      # 仓库内 workspace 版本保持 0.0.0,避免本地 dev 构建冒充已发布版本。release
      # 构建时把 tag 版本 stamp 进 [workspace.package],使 env!("CARGO_PKG_VERSION")
      # (--version / telemetry / MCP·HTTP user-agent 等)上报真实版本。仅此一行匹配。
      - name: Stamp release version into workspace manifest
        shell: bash
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          set -euo pipefail
          [[ -n "${VERSION:-}" ]] || { echo "VERSION is empty, refusing to build" >&2; exit 1; }
          sed -i.bak -E 's/^version = "0\.0\.0"$/version = "'"${VERSION}"'"/' Cargo.toml
          rm -f Cargo.toml.bak
          echo "Stamped workspace version: $(grep -m1 -E '^version = "' Cargo.toml)"

      - name: Build main binary and Code Mode host
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          cargo build --target "$target" --release -p codex-cli --bin codex -p codex-code-mode-host --bin codex-code-mode-host

      # Windows sandbox helpers must ship with the main exe — a clean
      # install enabling the sandbox fails at runtime without them.
      - name: Build Windows sandbox helpers
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          cargo build --target "$target" --release             -p codex-windows-sandbox             --bin codex-windows-sandbox-setup             --bin codex-command-runner

      - name: Strip release binary
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          for name in codex codex-code-mode-host; do
            bin="target/${target}/release/${name}"
            before=$(stat -f%z "$bin" 2>/dev/null || stat -c%s "$bin")
            if [[ "${{ runner.os }}" == "Linux" ]]; then
              strip "$bin"
            else
              strip -x "$bin"
            fi
            after=$(stat -f%z "$bin" 2>/dev/null || stat -c%s "$bin")
            echo "Stripped $bin: $before -> $after bytes"
          done

      - name: Create archive
        id: create_archive
        shell: bash
        run: |
          set -euo pipefail
          python3 "${GITHUB_WORKSPACE}/.github/scripts/package_nuwax_release.py" \
            --build-dir "${GITHUB_WORKSPACE}/codex-rs/target/${{ matrix.target }}/release" \
            --output-dir "${GITHUB_WORKSPACE}" \
            --version "${{ needs.get-version.outputs.version }}" \
            --target "${{ matrix.target }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.create_archive.outputs.archive_name }}
          path: ${{ steps.create_archive.outputs.archive_path }}
          retention-days: 1

  create-release:
    name: Create GitHub Release
    needs: [get-version, build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Build the tag's exact SHA: a manual dispatch combining a branch
          # checkout with a tag_name input would otherwise stamp the branch
          # HEAD as the tag's version.
          ref: ${{ needs.get-version.outputs.tag_name }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -la artifacts/

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.get-version.outputs.tag_name }}
          name: "Release ${{ needs.get-version.outputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to npm (latest)
    needs: [get-version, create-release]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.get-version.outputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install envsubst
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gettext-base

      - name: Update base package version
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          bash npm/publish/update-base-package.sh "$VERSION"

      - name: Install ossutil
        if: success()
        run: |
          curl -fSL -o /tmp/ossutil.zip \
            "https://gosspublic.alicdn.com/ossutil/v2/2.2.0/ossutil-2.2.0-linux-amd64.zip"
          unzip -q /tmp/ossutil.zip -d /tmp
          sudo mv /tmp/ossutil-2.2.0-linux-amd64/ossutil /usr/local/bin/
          ossutil version

      - name: Download release assets for OSS
        if: success()
        uses: actions/download-artifact@v4
        with:
          path: oss_assets

      - name: Upload binaries to OSS
        if: success()
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          cd oss_assets
          for f in */*.tar.gz */*.zip; do
            [ -f "$f" ] || continue
            fname=$(basename "$f")
            echo "Uploading $fname ..."
            ossutil cp --force "$f" \
              "oss://nuwa-packages/nuwax-codex/${{ needs.get-version.outputs.tag_name }}/${fname}" \
              --endpoint "https://oss-rg-china-mainland.aliyuncs.com" \
              --region "rg-china-mainland" \
              --access-key-id "$OSS_ACCESS_KEY_ID" \
              --access-key-secret "$OSS_ACCESS_KEY_SECRET"
          done

      # Publish to npm ONLY after every binary asset is uploaded and
      # verified: publishing first creates a window where installs 404,
      # and a later upload failure would leave an uninstallable version
      # that a re-run cannot fix (npm rejects same-version republish).
      - name: Verify all release assets are downloadable
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          EXPECTED=7
          FOUND=0
          for t in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu x86_64-unknown-linux-musl \
                   aarch64-unknown-linux-musl x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            ext="tar.gz"; [ "${t#*windows}" != "$t" ] && ext="zip"
            code=$(curl --connect-timeout 15 --max-time 180 -s -o /dev/null -w "%{http_code}" \
              "https://nuwa-packages.oss-rg-china-mainland.aliyuncs.com/nuwax-codex/${{ needs.get-version.outputs.tag_name }}/nuwax-codex-${VERSION}-${t}.${ext}")
            echo "$t -> HTTP $code"
            [ "$code" = "200" ] && FOUND=$((FOUND+1))
          done
          echo "Assets verified: $FOUND/$EXPECTED"
          [ "$FOUND" -eq "$EXPECTED" ]

      - name: Publish main package to npm (latest)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd npm
          npm publish --access public
