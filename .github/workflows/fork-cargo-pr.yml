# Fork-local offline PR verification (Cargo).
#
# Upstream's bazel.yml/rust-ci.yml were removed with the fork's Bazel
# retirement; this workflow is the executable replacement for PR gating on
# the Cargo workspace, including the fork-only bridge crates upstream never
# built. The bridge crates themselves regained BUILD.bazel wiring (see
# scripts/bazel_bridge_gate.sh): the bazel-bridge-gate job below keeps the
# Bazel-built public path on all three model wires under regression.
#
# Push and PR events run this offline gate. Manual dispatch is a separate
# user-authorized operation; completed runs and coverage limits are recorded
# in my-docs/rig-production-completion-2026-10-10/.

name: Fork Cargo PR

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"

jobs:
  test:
    name: nextest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # ubuntu fits its 180 with room: measured on run 39286738661, the workspace
    # test binaries compiled in 17m56s and the run took 35m19s. The macOS lane
    # cannot: the same tree compiled in 1h32m47s on run 39233543173 (finished
    # 2h49m27s, 11m of margin) and in 1h50m21s on run 39286738661, whose 180
    # minutes expired 3m47s after the run phase even started (12699/22877).
    # Compile is the fixed cost and is not shardable inside one job, so macOS
    # gets its own number until the archive+shard port lands.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            timeout: 180
            # voice-host pins the gstreamer v1_28 API surface. Ubuntu's apt
            # only ships gstreamer 1.24, so that lane cannot provision the
            # pinned version and excludes the crate; the macOS lane below
            # installs gstreamer 1.28 via brew and covers its build and unit
            # tests.
            voice_host: exclude
          - os: macos-latest
            timeout: 330
            voice_host: include
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@v4

      # The 21k-test workspace build fills the runner disk; the daemon tests
      # failed with "No space left on device" copying fixtures. Remove
      # preinstalled toolchains this workflow never uses (~25 GB) before the
      # build starts.
      - name: Free runner disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghcup /usr/local/.ghcup || true
          df -h /

      # Match codex-rs/rust-toolchain.toml so local receipts and CI use the
      # same compiler instead of silently moving with stable releases.
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcap-dev pkg-config bubblewrap

      # ubuntu-latest ≥24.04 restricts unprivileged user namespaces via
      # AppArmor (kernel.apparmor_restrict_unprivileged_userns=1); bubblewrap
      # then fails every sandbox start with "setting up uid map: Permission
      # denied", and every sandbox-dependent suite (landlock, exec-server
      # filesystem, core approvals/network flows) fails on the denial path
      # instead of exercising the sandbox. Re-enable unprivileged userns;
      # Skip this AppArmor-specific setting only when its sysctl key is
      # absent. A failed write must fail setup; sandbox tests still verify
      # actual namespace support on every runner.
      - name: Enable unprivileged user namespaces (Linux)
        if: runner.os == 'Linux'
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            echo "unprivileged userns re-enabled"
          else
            echo "AppArmor userns sysctl absent; sandbox tests will verify namespace support"
          fi

      - name: macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install pkgconf gstreamer gst-plugins-base

      - name: Install test tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,just

      # The pinned v8 150.4.0 requests ptrcomp_sandbox prebuilt archives
      # that denoland never published for that release; the Codex-built
      # paired artifacts under this repository's release tags carry the
      # matching binaries, verified against the in-repo trusted manifest
      # (third_party/v8/rusty_v8_150_4_0_release_manifests.sha256).
      - name: Setup rusty_v8 paired artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          # Runner labels can change architecture; match the installed native
          # Rust toolchain instead of assuming its host triple.
          target: host

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (fork surfaces)
        run: cargo clippy -p codex-rust-rig-bridge -p codex-live-tests -p codex-config -p codex-utils-cli --all-targets --locked -- -D warnings

      # The rig bridges are behind the rust-rig feature; the suite that
      # exercises them needs it enabled for codex-core.
      # The binary-level offline suite (live-tests::nuwax_env_offline)
      # drives the codex-exec executable and validates its embedded
      # source-receipt: nextest only builds test targets, so without this
      # step the executable comes from the restored target cache of an
      # older commit and the receipt correctly refuses it.
      - name: Build binary-level test executables
        run: cargo build --locked -p codex-exec --bin codex-exec

      - name: Test (workspace)
        shell: bash
        env:
          CODEX_TEST_SKIP_RECEIPT_FILE: ${{ github.workspace }}/codex-rs/target/skip-receipts.jsonl
        run: |
          # target/ comes back from the cache, so the previous hand's receipts
          # would otherwise read as evidence for this one.
          rm -f "$CODEX_TEST_SKIP_RECEIPT_FILE"
          if [[ "${{ matrix.voice_host }}" == "exclude" ]]; then
            just test --workspace --exclude codex-voice-host --features codex-core/rust-rig,codex-v8-poc/sandbox --locked -E 'not binary(exec_live) & not binary(bridge_live)' --retries 0
          else
            just test --workspace --features codex-core/rust-rig,codex-v8-poc/sandbox --locked -E 'not binary(exec_live) & not binary(bridge_live)' --retries 0
          fi

      # nextest captures a passing test's output, so "this leg skipped because
      # the host cannot sandbox" is otherwise indistinguishable from "this leg
      # passed". The legs that guard on a capability append to this file.
      - name: Skip receipts
        if: always()
        shell: bash
        env:
          CODEX_TEST_SKIP_RECEIPT_FILE: ${{ github.workspace }}/codex-rs/target/skip-receipts.jsonl
        run: |
          if [[ -f "$CODEX_TEST_SKIP_RECEIPT_FILE" ]]; then
            echo "legs skipped for host capability reasons: $(wc -l < "$CODEX_TEST_SKIP_RECEIPT_FILE")"
            cat "$CODEX_TEST_SKIP_RECEIPT_FILE"
          else
            echo "no skip receipt file: either the suite never ran or no leg skipped"
          fi

  bazel-bridge-gate:
    name: bazel bridge gate (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # bazel-contrib/setup-bazelisk does not exist (the workflow's original
      # reference failed with a missing-repository error); the maintained
      # action lives under the bazelbuild organization.
      - uses: bazelbuild/setup-bazelisk@v3.0.0

      - name: Gate and profiling helper regressions
        run: |
          python3 -m unittest discover -s scripts -p '*gate_tests.py' -v
          python3 -m unittest discover -s scripts -p 'd4*tests.py' -v
          python3 -m unittest discover -s scripts -p 'nextest_log_summary_tests.py' -v

      # Runs the REAL nuwax_env three-wire matrix against Bazel-built
      # binaries (path/credential/model/cap/single-POST/config-bytes) and the
      # bridges-out negative control (refusal before any network request).
      - name: Bridge gate
        run: ./scripts/bazel_bridge_gate.sh

  test-windows:
    name: nextest (windows)
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@v4

      # Native tests create databases and fixture trees in TEMP. The runner's
      # default C: TEMP filled during run 38782462743 while the checkout uses
      # the workspace drive. Keep test data off C: and outside the source tree.
      # The name must stay dash-free: upstream's decode_cur_project_path only
      # re-merges one adjacent ancestor pair, so a '-' here makes the four
      # Cursor project-detection legs undecodable (reproduced off CI by pointing
      # TMP/TEMP at a sibling codex-test-temp directory).
      - name: Configure Windows test temporary directory
        shell: pwsh
        run: |
          $testTemp = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'codextesttemp'
          New-Item -ItemType Directory -Force -Path $testTemp | Out-Null
          "TEMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free, Root

      # Keep this aligned with codex-rs/rust-toolchain.toml and the Unix lane.
      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs

      - name: Install test tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,just

      - name: Setup rusty_v8 paired artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: host

      # Same receipt contract as the matrix lane: build codex-exec for the
      # binary-level offline suite instead of restoring a stale one.
      - name: Build binary-level test executables
        run: cargo build --locked -p codex-exec --bin codex-exec

      # voice-host's pinned gstreamer v1_28 API surface needs the 500MB
      # gstreamer Windows installer plus pkg-config wiring, which this lane
      # does not provision; the macOS lane covers that crate's build and unit
      # tests.
      - name: Test (workspace)
        shell: bash
        run: just test --workspace --exclude codex-voice-host --features codex-core/rust-rig,codex-v8-poc/sandbox --locked -E 'not binary(exec_live) & not binary(bridge_live)' --retries 0
